services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: success_budget
      MYSQL_USER: success_budget
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher for confirmation-code emails - nothing sent through
  # it ever leaves this machine. Matches .env.example's SMTP_HOST/PORT.
  # Web UI to view caught emails: http://localhost:1080
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - '1080:1080'
      - '1025:1025'

volumes:
  mysql-data:
